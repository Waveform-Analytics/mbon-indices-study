# Cross-validation configuration

primary_strategy:
  name: week_based_kfold
  fold_by: iso_week
  min_fold_rows: 20

secondary_strategy:
  name: leave_one_station_out
  stations: ["9M", "14M", "37M"]
  repeats: 1

metrics:
  counts: ["rmse", "mae", "r2"]
  binary: ["auc", "accuracy", "sensitivity", "specificity"]

seeds:
  cv: 2025

# Optional diagnostics (not yet implemented)
